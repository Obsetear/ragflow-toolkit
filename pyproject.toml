[project]
name = "ragflow-toolkit"
version = "0.1.0"
description = "零依赖 RAGFlow 运维工具箱：百万级批量导入、断点续传、连通性体检、已知 bug 修补"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ragflow-toolkit contributors" }]
keywords = ["ragflow", "rag", "batch-import", "ops", "knowledge-base"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

[project.scripts]
ragflow-toolkit = "ragflow_toolkit:main"

[tool.setuptools]
py-modules = ["ragflow_toolkit"]
